name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Preparar arquivo .env DEV
        if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
        run: cp "$GITHUB_WORKSPACE/.env.dev.example" "$GITHUB_WORKSPACE/.env"

      - name: Preparar arquivo .env PROD
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: cp "$GITHUB_WORKSPACE/.env.prod.example" "$GITHUB_WORKSPACE/.env"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci falhou na tentativa $attempt. Limpando cache do npm e tentando novamente..."
              npm cache clean --force
              sleep $((attempt * 5))
            fi
          done

          echo "npm ci falhou apos 3 tentativas."
          exit 1

      - name: Rodar testes do backend
        env:
          JWT_SECRET: test-secret
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Preparar arquivo .env DEV
        if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
        run: cp "$GITHUB_WORKSPACE/.env.dev.example" "$GITHUB_WORKSPACE/.env"

      - name: Preparar arquivo .env PROD
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: cp "$GITHUB_WORKSPACE/.env.prod.example" "$GITHUB_WORKSPACE/.env"


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci falhou na tentativa $attempt. Limpando cache do npm e tentando novamente..."
              npm cache clean --force
              sleep $((attempt * 5))
            fi
          done

          echo "npm ci falhou apos 3 tentativas."
          exit 1

      - name: Rodar testes do frontend
        run: npm run test:ci

      - name: Gerar build
        run: npm run build
